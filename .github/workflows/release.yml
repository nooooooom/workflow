name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach workflow.zip to (e.g. v1.0.0)'
        required: true

jobs:
  attach-archive:
    name: build workflow.zip and attach to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Build workflow.zip
        run: |
          bash scripts/package-skill.sh dist/workflow.zip
          ls -lah dist/workflow.zip

      - name: Ensure release exists, then attach archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist, creating placeholder"
            gh release create "$TAG" --title "$TAG" --notes "Release notes pending. Edit on GitHub."
          fi
          gh release upload "$TAG" dist/workflow.zip --clobber
          echo "OK: workflow.zip attached to release $TAG"
