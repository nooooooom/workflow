name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: node --test tests/dual-memory.test.mjs tests/plugin-memory.test.mjs

      - name: Verify package script produces a clean archive
        run: |
          bash scripts/package-skill.sh /tmp/workflow-ci.zip
          unzip -l /tmp/workflow-ci.zip | tail -3
